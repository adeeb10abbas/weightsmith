name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'paper/main.pdf'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Add the paper PDF if it exists
        run: |
          if [ -f paper/main.pdf ]; then
            cp paper/main.pdf site/paper.pdf
            echo "Copied paper/main.pdf to site/paper.pdf"
          else
            echo "paper/main.pdf not found; the Paper link will 404 until it is added"
          fi

      # The custom domain sits behind a CDN that caches the PDF for hours, so stamp the page's paper links with the
      # PDF's content hash: each new paper gets a new URL, and readers never get a stale or half-cached copy.
      - name: Version the paper links
        run: |
          if [ -f site/paper.pdf ]; then
            h=$(sha256sum site/paper.pdf | cut -c1-12)
            sed -i "s#href=\"paper.pdf\"#href=\"paper.pdf?v=$h\"#g" site/*.html
            echo "paper links now point to paper.pdf?v=$h ($(grep -o "paper.pdf?v=$h" site/*.html | wc -l) links)"
          fi

      # The same for stylesheets and scripts: browsers keep them for 4 hours (max-age=14400), so a page could
      # arrive with a stale style.css and render new figures unstyled. Each local .css/.js link gets ?v=<hash>.
      - name: Version the stylesheet and script links
        run: |
          python3 - <<'EOF'
          import hashlib, pathlib, re
          site = pathlib.Path("site")
          ref = re.compile(r'((?:href|src)=")([^"?#:]+\.(?:css|js))(")')
          for page in site.rglob("*.html"):
              text = page.read_text(encoding="utf-8")
              def stamp(m):
                  target = (page.parent / m.group(2)).resolve()
                  if not target.is_file():
                      return m.group(0)
                  h = hashlib.sha256(target.read_bytes()).hexdigest()[:12]
                  return f"{m.group(1)}{m.group(2)}?v={h}{m.group(3)}"
              new, n = ref.subn(stamp, text)
              if new != text:
                  page.write_text(new, encoding="utf-8")
                  print(f"{page}: {n} css/js links versioned")
          EOF

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
