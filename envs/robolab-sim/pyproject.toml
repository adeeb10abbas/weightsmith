[project]
name = "weight-space-robolab-env"
version = "0.1.0"
description = "Pinned RoboLab 3-D evaluation environment for weight-space policy experiments"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy==1.26.0",
    "openpi-client",
    "pillow==11.2.1",
    "protobuf==5.29.5",
    "robolab[isaac50]",
    "torch==2.7.1",
    "torchvision==0.22.1",
    "transformers==4.53.2",
    "warp-lang==1.7.2",
]

# RoboLab and OpenPI are kept at their existing, separately versioned checkouts.
# This environment supplies only the simulator and lightweight policy client.
[tool.uv.sources]
robolab = { path = "../../third_party/RoboLab", editable = true }
openpi-client = { path = "../../third_party/openpi/packages/openpi-client", editable = true }
torch = { index = "pytorch-cu118" }
torchvision = { index = "pytorch-cu118" }

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com"

[tool.uv]
package = false
index-strategy = "unsafe-best-match"
override-dependencies = [
    # The workstation's 535 driver cannot load CUDA 12.8 PyTorch wheels.
    "torch==2.7.1",
    "torchvision==0.22.1",
    # Keep Isaac Lab 2.2 on the API generation it was released against.
    "warp-lang==1.7.2",
    "transformers==4.53.2",
    # RoboLab's policy client requires the modern WebSocket API.
    "websockets>=14,<18",
]

[tool.uv.extra-build-dependencies]
flatdict = ["setuptools<81", "wheel"]
