[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "weightsmith"
version = "0.1.0"
description = "LLM weight editing for robot policies: a benchmark, agent tools and portable edits for OpenPI pi0.5 on NVIDIA RoboLab."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Ali-Adeeb Abbas" }, { name = "Esmaeil Seraj" }]
keywords = [
  "robotics", "weight editing", "weight-space programming", "vision-language-action",
  "pi0.5", "openpi", "robolab", "model context protocol", "benchmark",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# The editor-side toolkit needs only numpy. The GPU-host runtime (OpenPI, RoboLab, Isaac Sim)
# is installed separately and pinned by scripts/setup_deps.sh; see docs/SETUP.md.
dependencies = ["numpy>=1.22"]

[project.optional-dependencies]
mcp = ["mcp>=1.10"]                                      # weightsmith mcp: the MCP server
hub = ["huggingface_hub>=0.23", "safetensors>=0.4"]      # integrations/hub: Hugging Face export
dev = ["pytest>=7", "ruff>=0.6"]

[project.scripts]
weightsmith = "weightsmith.cli:main"

[project.urls]
Homepage = "https://adeeb10abbas.github.io/weightsmith/"
Repository = "https://github.com/adeeb10abbas/weightsmith"
Issues = "https://github.com/adeeb10abbas/weightsmith/issues"

[tool.hatch.build.targets.wheel]
packages = ["weightsmith"]

[tool.hatch.build.targets.sdist]
include = ["weightsmith", "bin", "integrations", "tests", "README.md", "LICENSE", "NOTICE"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
# Lint the toolkit. The research runtime keeps its original, measured form, and the study
# material is frozen, so neither is reformatted.
extend-exclude = [
  "study", "paper", "site", "scripts", "third_party", "envs",
  "weightsmith/lab",
  "weightsmith/acts_worker.py", "weightsmith/batched_client.py", "weightsmith/batched_server.py",
  "weightsmith/config.py", "weightsmith/heldout.py", "weightsmith/locks.py", "weightsmith/owsp.py",
  "weightsmith/pool.py", "weightsmith/rollout.py", "weightsmith/run_batched.py", "weightsmith/survey.py",
  "tests/test_pool_lanes.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["weightsmith"]
