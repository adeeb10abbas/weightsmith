  <g id="text_22">
   <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(195.669125 267.477281)">Values changed = stored weight values that differ from the unedited checkpoint. Earlier runs on ali-ms (RTX 3090, performance preset). 12 of</text>
   <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(195.669125 275.763662)">the 14 chunks ran on one GPU lane, so their second 16 slots started from other scenes; study/results/opus/where/ repeats every comparison on</text>
   <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(195.669125 284.050044)">the 32 unaffected slots with the same ordering. Whiskers: Wilson 95%.</text>
